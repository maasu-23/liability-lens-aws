<text x="1070" y="266" text-anchor="middle" font-size="11.5" fill="#374151" font-style="italic">MCP,</text>
<text x="1070" y="280" text-anchor="middle" font-size="11.5" fill="#374151" font-style="italic">SigV4</text>
