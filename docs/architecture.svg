<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1640 1000" width="1640" height="1000" font-family="DejaVu Sans, Verdana, Arial, sans-serif">
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#374151"/></marker></defs>
<rect width="1640" height="1000" fill="#FFFFFF"/>
<text x="30" y="38" font-size="24" font-weight="700" fill="#111827">Liability Lens: serverless architecture</text>
<text x="30" y="60" font-size="13.5" fill="#4B5563">The model talks, the code decides. No servers to run and no pipeline: three deploy scripts from a laptop.</text>
<rect x="235" y="85" width="1370" height="880" rx="16" fill="#FAFAFB" stroke="#9CA3AF" stroke-width="2" stroke-dasharray="3 4"/>
<text x="252" y="108" font-size="13" font-weight="700" fill="#6B7280">AWS Cloud, us-east-1</text>
<rect x="30" y="245" width="170" height="90" rx="10" fill="#F3F4F6" stroke="#4B5563" stroke-width="2"/>
<text x="115.0" y="275.0" text-anchor="middle" font-size="15" font-weight="700" fill="#111827">Browser or phone</text>
<text x="115.0" y="295.0" text-anchor="middle" font-size="12.5" fill="#374151">chat + case file</text>
<text x="115.0" y="315.0" text-anchor="middle" font-size="12.5" fill="#374151">static page, plain JS</text>
<rect x="30" y="740" width="170" height="80" rx="10" fill="#F3F4F6" stroke="#4B5563" stroke-width="2"/>
