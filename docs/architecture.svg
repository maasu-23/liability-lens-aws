<path d="M620,820 L620,880 L115,880 L115,820" fill="none" stroke="#374151" stroke-width="2" marker-end="url(#a)"/>
<text x="370" y="872" text-anchor="middle" font-size="11.5" fill="#374151" font-style="italic">email</text>
