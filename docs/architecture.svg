<text x="920.0" y="448.0" text-anchor="middle" font-size="15" font-weight="700" fill="#111827">Amazon Bedrock</text>
<text x="920.0" y="468.0" text-anchor="middle" font-size="12.5" fill="#374151">Claude Sonnet 4.6</text>
