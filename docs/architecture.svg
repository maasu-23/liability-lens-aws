<text x="760" y="266" text-anchor="middle" font-size="11.5" fill="#374151" font-style="italic">invoke,</text>
<text x="760" y="280" text-anchor="middle" font-size="11.5" fill="#374151" font-style="italic">streamed</text>
<path d="M920,180 L920,215" fill="none" stroke="#374151" stroke-width="2" marker-end="url(#a)" marker-start="url(#a)"/>
<path d="M920,420 L920,365" fill="none" stroke="#374151" stroke-width="2" marker-end="url(#a)" marker-start="url(#a)"/>
