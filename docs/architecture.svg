<text x="1195.0" y="275.0" text-anchor="middle" font-size="15" font-weight="700" fill="#111827">AgentCore Gateway</text>
<text x="1195.0" y="295.0" text-anchor="middle" font-size="12.5" fill="#374151">IAM auth, MCP tools</text>
<text x="1195.0" y="315.0" text-anchor="middle" font-size="12.5" fill="#374151">one target per Lambda</text>
