<text x="360.0" y="175.0" text-anchor="middle" font-size="12.5" fill="#374151">private, CloudFront OAC</text>
<rect x="270" y="245" width="180" height="90" rx="10" fill="#EEF2FF" stroke="#4F46E5" stroke-width="2"/>
<text x="360.0" y="275.0" text-anchor="middle" font-size="15" font-weight="700" fill="#111827">Amazon CloudFront</text>
<text x="360.0" y="295.0" text-anchor="middle" font-size="12.5" fill="#374151">HTTPS, CSP + security</text>
<text x="360.0" y="315.0" text-anchor="middle" font-size="12.5" fill="#374151">headers, /api/* routed</text>
