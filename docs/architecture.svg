<path d="M720,322 L740,322 L740,625 L1340,625" fill="none" stroke="#374151" stroke-width="2" stroke-dasharray="6 5" marker-end="url(#a)"/>
<text x="760" y="612" text-anchor="start" font-size="11.5" fill="#374151" font-style="italic">presigned POST (upload) and presigned GET (draft links)</text>
<rect x="520" y="580" width="200" height="80" rx="10" fill="#EAF7EE" stroke="#1E8A4C" stroke-width="2"/>
<text x="620.0" y="605.0" text-anchor="middle" font-size="15" font-weight="700" fill="#111827">Amazon DynamoDB</text>
<text x="620.0" y="625.0" text-anchor="middle" font-size="12.5" fill="#374151">sessions, turn caps,</text>
<text x="620.0" y="645.0" text-anchor="middle" font-size="12.5" fill="#374151">reminder records (TTL)</text>
<rect x="255" y="580" width="220" height="80" rx="10" fill="#FFEFF5" stroke="#C7316B" stroke-width="2"/>
<text x="365.0" y="605.0" text-anchor="middle" font-size="15" font-weight="700" fill="#111827">EventBridge Scheduler</text>
<text x="365.0" y="625.0" text-anchor="middle" font-size="12.5" fill="#374151">one-time at(), Asia/Kolkata</text>
<text x="365.0" y="645.0" text-anchor="middle" font-size="12.5" fill="#374151">deletes itself after run</text>
<rect x="270" y="740" width="190" height="80" rx="10" fill="#FFF4E8" stroke="#D9680B" stroke-width="2"/>
<text x="365.0" y="765.0" text-anchor="middle" font-size="15" font-weight="700" fill="#111827">Lambda: reminder</text>
<text x="365.0" y="785.0" text-anchor="middle" font-size="12.5" fill="#374151">reads its DynamoDB record,</text>
<text x="365.0" y="805.0" text-anchor="middle" font-size="12.5" fill="#374151">sends once, fixed wording</text>
<rect x="520" y="740" width="200" height="80" rx="10" fill="#FFEFF5" stroke="#C7316B" stroke-width="2"/>
<text x="620.0" y="775.0" text-anchor="middle" font-size="15" font-weight="700" fill="#111827">Amazon SES</text>
<text x="620.0" y="795.0" text-anchor="middle" font-size="12.5" fill="#374151">sandbox, verified sender</text>
<path d="M590,335 L590,580" fill="none" stroke="#374151" stroke-width="2" marker-end="url(#a)"/>
<text x="596" y="460" text-anchor="start" font-size="11.5" fill="#374151" font-style="italic">sessions, caps,</text>
<text x="596" y="474" text-anchor="start" font-size="11.5" fill="#374151" font-style="italic">reminders</text>
<path d="M530,335 L530,470 L365,470 L365,580" fill="none" stroke="#374151" stroke-width="2" marker-end="url(#a)"/>
<text x="448" y="462" text-anchor="middle" font-size="11.5" fill="#374151" font-style="italic">create schedules</text>
<path d="M365,660 L365,740" fill="none" stroke="#374151" stroke-width="2" marker-end="url(#a)"/>
<text x="372" y="690" text-anchor="start" font-size="11.5" fill="#374151" font-style="italic">9 AM IST,</text>
<text x="372" y="704" text-anchor="start" font-size="11.5" fill="#374151" font-style="italic">day before and day of</text>
