<path d="M1300,873 L1340,873" stroke="#374151" stroke-width="2" stroke-dasharray="6 5" marker-end="url(#a)"/><text x="1350" y="877" font-size="12.5" fill="#374151">time-limited link</text>
<text x="1020" y="905" font-size="12" fill="#6B7280">All data in the demo is synthetic. Nothing is filed for the user.</text>
<text x="1020" y="922" font-size="12" fill="#6B7280">The agent never sees raw OCR text: the extract tool returns parsed fields only.</text>
