<text x="485" y="281" text-anchor="middle" font-size="11.5" fill="#374151" font-style="italic">/api/*</text>
<rect x="800" y="110" width="240" height="70" rx="10" fill="#F5EEFF" stroke="#7C3AED" stroke-width="2"/>
<text x="920.0" y="140.0" text-anchor="middle" font-size="15" font-weight="700" fill="#111827">AgentCore Memory</text>
<text x="920.0" y="160.0" text-anchor="middle" font-size="12.5" fill="#374151">short-term session memory</text>
<rect x="800" y="215" width="240" height="150" rx="10" fill="#F5EEFF" stroke="#7C3AED" stroke-width="3"/>
<text x="920.0" y="265.0" text-anchor="middle" font-size="15" font-weight="700" fill="#111827">AgentCore Runtime</text>
<text x="920.0" y="285.0" text-anchor="middle" font-size="12.5" fill="#374151">Strands agent (Python 3.14)</text>
<text x="920.0" y="305.0" text-anchor="middle" font-size="12.5" fill="#374151">interviews, calls tools,</text>
<text x="920.0" y="325.0" text-anchor="middle" font-size="12.5" fill="#374151">writes fixed-template replies</text>
