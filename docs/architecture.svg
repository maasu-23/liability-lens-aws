<text x="1447.5" y="132.5" text-anchor="middle" font-size="15" font-weight="700" fill="#111827">Lambda: case tools</text>
<text x="1447.5" y="152.5" text-anchor="middle" font-size="12.5" fill="#374151">classify_case, entitlement,</text>
<text x="1447.5" y="172.5" text-anchor="middle" font-size="12.5" fill="#374151">deadline_calendar</text>
<rect x="1340" y="245" width="215" height="90" rx="10" fill="#FFF4E8" stroke="#D9680B" stroke-width="2"/>
<text x="1447.5" y="275.0" text-anchor="middle" font-size="15" font-weight="700" fill="#111827">Lambda: extract</text>
<text x="1447.5" y="295.0" text-anchor="middle" font-size="12.5" fill="#374151">container image, Tesseract</text>
<text x="1447.5" y="315.0" text-anchor="middle" font-size="12.5" fill="#374151">OCR (eng + hin), redaction</text>
<rect x="1340" y="380" width="215" height="90" rx="10" fill="#FFF4E8" stroke="#D9680B" stroke-width="2"/>
<text x="1447.5" y="410.0" text-anchor="middle" font-size="15" font-weight="700" fill="#111827">Lambda: drafts</text>
<text x="1447.5" y="430.0" text-anchor="middle" font-size="12.5" fill="#374151">container image, fpdf2</text>
<text x="1447.5" y="450.0" text-anchor="middle" font-size="12.5" fill="#374151">fixed templates, no model</text>
<path d="M1290,290 L1315,290 L1315,148 L1340,148" fill="none" stroke="#374151" stroke-width="2" marker-end="url(#a)"/>
<path d="M1290,290 L1340,290" fill="none" stroke="#374151" stroke-width="2" marker-end="url(#a)"/>
<path d="M1290,290 L1315,290 L1315,425 L1340,425" fill="none" stroke="#374151" stroke-width="2" marker-end="url(#a)"/>
<text x="1447" y="208" text-anchor="middle" font-size="12" font-weight="700" fill="#B7791F">rules.py: every rupee,</text>
<text x="1447" y="223" text-anchor="middle" font-size="12" font-weight="700" fill="#B7791F">paragraph and date</text>
<text x="1100" y="360" font-size="12" fill="#6B7280">Page draws the case file from</text>
<text x="1100" y="375" font-size="12" fill="#6B7280">tool inputs and results only.</text>
<rect x="1340" y="580" width="215" height="90" rx="10" fill="#EAF7EE" stroke="#1E8A4C" stroke-width="2"/>
<text x="1447.5" y="610.0" text-anchor="middle" font-size="15" font-weight="700" fill="#111827">S3 case bucket</text>
<text x="1447.5" y="630.0" text-anchor="middle" font-size="12.5" fill="#374151">encrypted, uploads/ + drafts/</text>
<text x="1447.5" y="650.0" text-anchor="middle" font-size="12.5" fill="#374151">objects expire after 1 day</text>
<path d="M1447,470 L1447,580" fill="none" stroke="#374151" stroke-width="2" marker-end="url(#a)"/>
<text x="1457" y="530" text-anchor="start" font-size="11.5" fill="#374151" font-style="italic">PDFs</text>
