AWSTemplateFormatVersion: "2010-09-09"
Description: Liability Lens case bucket, Tesseract extraction Lambda and document drafting Lambda (one container image)

Parameters:
  ImageUri:
    Type: String
    Description: ECR image URI of the extraction Lambda, pushed by scripts/deploy_extract.sh

Resources:
  UploadBucket:
    Type: AWS::S3::Bucket
    DeletionPolicy: Delete
    Properties:
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault: {SSEAlgorithm: AES256}
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      LifecycleConfiguration:
        Rules:
          - Id: expire-uploads-after-one-day
            Status: Enabled
            Prefix: uploads/
            ExpirationInDays: 1
          - Id: expire-drafts-after-one-day
            Status: Enabled
            Prefix: drafts/
            ExpirationInDays: 1
          - Id: abort-incomplete-uploads
            Status: Enabled
            AbortIncompleteMultipartUpload: {DaysAfterInitiation: 1}

  UploadBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref UploadBucket
      PolicyDocument:
        Statement:
          - Sid: DenyInsecureTransport
            Effect: Deny
            Principal: "*"
            Action: "s3:*"
            Resource: [!GetAtt UploadBucket.Arn, !Sub "${UploadBucket.Arn}/*"]
            Condition: {Bool: {"aws:SecureTransport": "false"}}

  ExtractRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal: {Service: lambda.amazonaws.com}
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole
      Policies:
        - PolicyName: read-uploads
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action: s3:GetObject
                Resource: !Sub "${UploadBucket.Arn}/uploads/*"

  ExtractLogs:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: /aws/lambda/liability-lens-extract
      RetentionInDays: 7

  ExtractFunction:
    Type: AWS::Lambda::Function
    DependsOn: ExtractLogs
    Properties:
      FunctionName: liability-lens-extract
      PackageType: Image
      Code: {ImageUri: !Ref ImageUri}
      Role: !GetAtt ExtractRole.Arn
      MemorySize: 2048
      Timeout: 90
      Environment:
        Variables:
          EXTRACT_BUCKET: !Ref UploadBucket

  DraftsRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal: {Service: lambda.amazonaws.com}
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole
      Policies:
        - PolicyName: write-and-share-drafts
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action: [s3:PutObject, s3:GetObject]
                Resource: !Sub "${UploadBucket.Arn}/drafts/*"

  DraftsLogs:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: /aws/lambda/liability-lens-drafts
      RetentionInDays: 7

  DraftsFunction:
    Type: AWS::Lambda::Function
    DependsOn: DraftsLogs
    Properties:
      FunctionName: liability-lens-drafts
      PackageType: Image
      Code: {ImageUri: !Ref ImageUri}
      ImageConfig:
        Command: [drafts_handler.handler]
      Role: !GetAtt DraftsRole.Arn
      MemorySize: 512
      Timeout: 30
      Environment:
        Variables:
          EXTRACT_BUCKET: !Ref UploadBucket

Outputs:
  FunctionName:
    Value: !Ref ExtractFunction
  DraftsFunctionName:
    Value: !Ref DraftsFunction
  BucketName:
    Value: !Ref UploadBucket
