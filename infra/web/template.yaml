AWSTemplateFormatVersion: "2010-09-09"
Description: Liability Lens web - static page on S3 behind CloudFront, streaming proxy Lambda, sessions and reminders table, EventBridge Scheduler and SES email reminders

Parameters:
  CodeBucket:
    Type: String
    Description: Bucket holding the proxy zip (created by scripts/deploy_web.sh)
  CodeKey:
    Type: String
  RuntimeArn:
    Type: String
    Description: AgentCore runtime ARN, looked up by scripts/deploy_web.sh
  UploadBucket:
    Type: String
    Description: Case bucket from the liability-lens-extract stack
  AccessCode:
    Type: String
    NoEcho: true
    MinLength: 12
  SenderEmail:
    Type: String
    Description: SES-verified address reminders are sent from (kept in .env.local, never in the repository)
    AllowedPattern: "[^@\\s]+@[^@\\s]+\\.[^@\\s]+"

Resources:
  SiteBucket:
    Type: AWS::S3::Bucket
    DeletionPolicy: Delete
    Properties:
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault: {SSEAlgorithm: AES256}
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true

  SiteBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref SiteBucket
      PolicyDocument:
        Statement:
          - Sid: CloudFrontReadsSite
            Effect: Allow
            Principal: {Service: cloudfront.amazonaws.com}
            Action: s3:GetObject
            Resource: !Sub "${SiteBucket.Arn}/*"
            Condition:
              StringEquals:
                AWS:SourceArn: !Sub "arn:aws:cloudfront::${AWS::AccountId}:distribution/${Distribution}"
          - Sid: DenyInsecureTransport
            Effect: Deny
            Principal: "*"
            Action: "s3:*"
            Resource: [!GetAtt SiteBucket.Arn, !Sub "${SiteBucket.Arn}/*"]
            Condition: {Bool: {"aws:SecureTransport": "false"}}

  Sessions:
    Type: AWS::DynamoDB::Table
    DeletionPolicy: Delete
    Properties:
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - {AttributeName: pk, AttributeType: S}
      KeySchema:
        - {AttributeName: pk, KeyType: HASH}
      TimeToLiveSpecification: {AttributeName: expires, Enabled: true}

  ProxyRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal: {Service: lambda.amazonaws.com}
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole
      Policies:
        - PolicyName: proxy
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action: bedrock-agentcore:InvokeAgentRuntime
                Resource: [!Ref RuntimeArn, !Sub "${RuntimeArn}/runtime-endpoint/*"]
              - Effect: Allow
                Action: [dynamodb:GetItem, dynamodb:PutItem, dynamodb:UpdateItem]
                Resource: !GetAtt Sessions.Arn
              - Effect: Allow
                Action: s3:PutObject
                Resource: !Sub "arn:aws:s3:::${UploadBucket}/uploads/*"
              - Effect: Allow
                Action: dynamodb:DeleteItem
                Resource: !GetAtt Sessions.Arn
              - Sid: ManageReminderSchedules
                Effect: Allow
                Action: [scheduler:CreateSchedule, scheduler:DeleteSchedule]
                Resource: !Sub "arn:aws:scheduler:${AWS::Region}:${AWS::AccountId}:schedule/${ReminderGroup}/*"
              - Sid: HandSchedulerItsRole
                Effect: Allow
                Action: iam:PassRole
                Resource: !GetAtt SchedulerRole.Arn
                Condition:
                  StringEquals: {"iam:PassedToService": scheduler.amazonaws.com}
              - Sid: CheckAndSendReminderEmail
                Effect: Allow
                Action: [ses:SendEmail, ses:GetEmailIdentity]
                Resource: !Sub "arn:aws:ses:${AWS::Region}:${AWS::AccountId}:identity/*"

  ProxyLogs:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: /aws/lambda/liability-lens-web
      RetentionInDays: 7

  Proxy:
    Type: AWS::Lambda::Function
    DependsOn: ProxyLogs
    Properties:
      FunctionName: liability-lens-web
      Runtime: nodejs22.x
      Handler: index.handler
      Code: {S3Bucket: !Ref CodeBucket, S3Key: !Ref CodeKey}
      Role: !GetAtt ProxyRole.Arn
      MemorySize: 512
      Timeout: 300
      Environment:
        Variables:
          RUNTIME_ARN: !Ref RuntimeArn
          TABLE: !Ref Sessions
          UPLOAD_BUCKET: !Ref UploadBucket
          ACCESS_CODE: !Ref AccessCode
          SENDER_EMAIL: !Ref SenderEmail
          SCHEDULE_GROUP: !Ref ReminderGroup
          REMINDER_ARN: !GetAtt ReminderFunction.Arn
          SCHEDULER_ROLE_ARN: !GetAtt SchedulerRole.Arn

  # ---- reminders: EventBridge Scheduler calls this function on the day, and it sends the email through SES ----
  ReminderGroup:
    Type: AWS::Scheduler::ScheduleGroup
    Properties:
      Name: liability-lens

  ReminderRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal: {Service: lambda.amazonaws.com}
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole
      Policies:
        - PolicyName: send-reminders
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action: [dynamodb:GetItem, dynamodb:UpdateItem]
                Resource: !GetAtt Sessions.Arn
              - Effect: Allow
                Action: [ses:SendEmail, ses:GetEmailIdentity]
                Resource: !Sub "arn:aws:ses:${AWS::Region}:${AWS::AccountId}:identity/*"

  ReminderLogs:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: /aws/lambda/liability-lens-reminder
      RetentionInDays: 7

  ReminderFunction:
    Type: AWS::Lambda::Function
    DependsOn: ReminderLogs
    Properties:
      FunctionName: liability-lens-reminder
      Runtime: nodejs22.x
      Handler: reminder.handler
      Code: {S3Bucket: !Ref CodeBucket, S3Key: !Ref CodeKey}
      Role: !GetAtt ReminderRole.Arn
      MemorySize: 256
      Timeout: 30
      Environment:
        Variables:
          TABLE: !Ref Sessions
          SENDER_EMAIL: !Ref SenderEmail

  SchedulerRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal: {Service: scheduler.amazonaws.com}
            Action: sts:AssumeRole
            Condition:
              StringEquals: {"aws:SourceAccount": !Ref "AWS::AccountId"}
      Policies:
        - PolicyName: invoke-reminder
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action: lambda:InvokeFunction
                Resource: !GetAtt ReminderFunction.Arn

  ProxyUrl:
    Type: AWS::Lambda::Url
    Properties:
      TargetFunctionArn: !Ref Proxy
      AuthType: NONE
      InvokeMode: RESPONSE_STREAM

  ProxyUrlPermission:
    Type: AWS::Lambda::Permission
    Properties:
      FunctionName: !Ref Proxy
      Action: lambda:InvokeFunctionUrl
      Principal: "*"
      FunctionUrlAuthType: NONE

  ProxyInvokePermission:
    Type: AWS::Lambda::Permission
    Properties:
      FunctionName: !Ref Proxy
      Action: lambda:InvokeFunction
      Principal: "*"
      InvokedViaFunctionUrl: true

  SiteOac:
    Type: AWS::CloudFront::OriginAccessControl
    Properties:
      OriginAccessControlConfig:
        Name: !Sub "${AWS::StackName}-site"
        OriginAccessControlOriginType: s3
        SigningBehavior: always
        SigningProtocol: sigv4

  # Security headers, including a Content-Security-Policy: the page runs only its own script, talks only to itself and to
  # the upload bucket (presigned browser uploads), and cannot be framed. Style attributes need 'unsafe-inline' for styles only.
  SecurityHeaders:
    Type: AWS::CloudFront::ResponseHeadersPolicy
    Properties:
      ResponseHeadersPolicyConfig:
        Name: !Sub "${AWS::StackName}-security-headers"
        SecurityHeadersConfig:
          ContentSecurityPolicy:
            Override: true
            ContentSecurityPolicy: "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self'; connect-src 'self' https://*.s3.amazonaws.com https://*.s3.us-east-1.amazonaws.com; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'"
          ContentTypeOptions: {Override: true}
          FrameOptions: {FrameOption: DENY, Override: true}
          ReferrerPolicy: {ReferrerPolicy: strict-origin-when-cross-origin, Override: true}
          StrictTransportSecurity: {AccessControlMaxAgeSec: 31536000, IncludeSubdomains: true, Override: true}

  Distribution:
    Type: AWS::CloudFront::Distribution
    Properties:
      DistributionConfig:
        Enabled: true
        Comment: Liability Lens
        DefaultRootObject: index.html
        HttpVersion: http2and3
        PriceClass: PriceClass_200
        Origins:
          - Id: site
            DomainName: !GetAtt SiteBucket.RegionalDomainName
            OriginAccessControlId: !GetAtt SiteOac.Id
            S3OriginConfig: {OriginAccessIdentity: ""}
          - Id: api
            DomainName: !Select [2, !Split ["/", !GetAtt ProxyUrl.FunctionUrl]]
            CustomOriginConfig:
              OriginProtocolPolicy: https-only
              OriginReadTimeout: 60
        DefaultCacheBehavior:
          TargetOriginId: site
          ViewerProtocolPolicy: redirect-to-https
          Compress: true
          CachePolicyId: 658327ea-f89d-4fab-a63d-7e88639e58f6          # Managed-CachingOptimized
          ResponseHeadersPolicyId: !Ref SecurityHeaders
        CacheBehaviors:
          - PathPattern: /api/*
            TargetOriginId: api
            ViewerProtocolPolicy: https-only
            AllowedMethods: [GET, HEAD, OPTIONS, PUT, POST, PATCH, DELETE]
            CachePolicyId: 4135ea2d-6df8-44a3-9df3-4b5a84be39ad            # Managed-CachingDisabled
            OriginRequestPolicyId: b689b0a8-53d0-40ab-baf2-68738e2966ac    # Managed-AllViewerExceptHostHeader
            ResponseHeadersPolicyId: !Ref SecurityHeaders

Outputs:
  SiteUrl:
    Value: !Sub "https://${Distribution.DomainName}"
  SiteBucketName:
    Value: !Ref SiteBucket
  DistributionId:
    Value: !Ref Distribution
